name: CI

on:
  push:
    branches: [main, migration, 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @dbx/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests (mock Sankhya)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: db-sankhya:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (compose, no Sankhya credentials)
        run: |
          rand() { openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c "$1"; }
          sed -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(rand 24)|" \
              -e "s|^AUTH_SECRET=.*|AUTH_SECRET=$(rand 48)|"               -e "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" \
              -e "s|^SANKHYA_MODE=.*|SANKHYA_MODE=live|" \
              -e "s|^APP_URL=.*|APP_URL=https://localhost|" \
              .env.example > .env
          docker compose up -d --no-build
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3001/health/ready && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
