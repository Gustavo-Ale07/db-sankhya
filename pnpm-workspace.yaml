packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5
  - '@tanstack/react-virtual@3.14.21'
  - '@tanstack/virtual-core@3.19.6'

# Patched transitive dependencies (advisories: dompurify <3.4.16 via monaco-editor, esbuild <0.25.0 via drizzle-kit).
overrides:
  dompurify: 3.4.16
  'esbuild@<0.25.0': 0.25.12
